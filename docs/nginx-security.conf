# Include inside your server { } block.
location ~* /wp-content/uploads/bmn-private/ { deny all; return 404; }
location = /xmlrpc.php { deny all; return 404; }
location ~* /wp-content/uploads/.*\.php$ { deny all; }
location ~ /\.(?!well-known) { deny all; }
add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
# Service worker must be served from the site root:
location = /bmn-sw.js { try_files $uri /index.php?$args; }
