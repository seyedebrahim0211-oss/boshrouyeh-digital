# Local development: http://localhost:8080  (admin user is created by the wp-cli service).
services:
  db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wordpress
      MARIADB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes: [db:/var/lib/mysql]

  wordpress:
    image: wordpress:6-php8.3-apache
    depends_on: [db]
    ports: ["8080:80"]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_DEBUG', true );
        define( 'WP_DEBUG_LOG', true );
        define( 'WP_DEBUG_DISPLAY', false );
        define( 'BMN_SMS_DRIVER', 'log' );
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
    volumes:
      - wp:/var/www/html
      - ./wordpress/themes/boshrouyeh-khesht:/var/www/html/wp-content/themes/boshrouyeh-khesht
      - ./wordpress/plugins/boshrouyeh-core:/var/www/html/wp-content/plugins/boshrouyeh-core
      - ./wordpress/plugins/boshrouyeh-eservices:/var/www/html/wp-content/plugins/boshrouyeh-eservices
      - ./wordpress/plugins/khesht-builder:/var/www/html/wp-content/plugins/khesht-builder

  cli:
    image: wordpress:cli-php8.3
    depends_on: [wordpress]
    user: "33:33"
    volumes: [wp:/var/www/html]
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-change-me-local}
      WORDPRESS_DB_NAME: wordpress
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 15
        wp core is-installed || wp core install --url=http://localhost:8080 --title="شهرداری بشرویه" --admin_user=admin --admin_password=${ADMIN_PASSWORD:-change-me-local} --admin_email=admin@example.com --skip-email
        wp option update timezone_string Asia/Tehran
        wp rewrite structure '/%postname%/' --hard
        wp language core install fa_IR --activate || true
        wp theme activate boshrouyeh-khesht
        wp plugin activate boshrouyeh-core boshrouyeh-eservices khesht-builder
        wp bmn demo

volumes:
  db:
  wp:
