name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP lint & WPCS (security)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.0", "8.1", "8.2", "8.3"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer
          coverage: none
      - name: Syntax check
        run: |
          status=0
          while IFS= read -r -d '' f; do php -l "$f" > /dev/null || status=1; done < <(find wordpress bin -name '*.php' -print0)
          exit $status
      - name: Icon sets in sync
        run: php bin/sync-icons.php --check
      - name: WordPress Coding Standards (security rules)
        if: matrix.php == '8.3'
        run: |
          composer install --no-interaction --no-progress
          vendor/bin/phpcs --report=summary --report-full

  e2e:
    name: End-to-end (WordPress + Playwright)
    runs-on: ubuntu-latest
    needs: php
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite, gd, intl
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up WordPress
        run: tests/e2e/setup-wp.sh "$RUNNER_TEMP/wp" 8088
      - name: Start server
        run: |
          php -S localhost:8088 -t "$RUNNER_TEMP/wp/site" tests/e2e/router.php > "$RUNNER_TEMP/server.log" 2>&1 &
          sleep 2
          curl -fsS http://localhost:8088/ > /dev/null
      - name: Install Playwright
        run: |
          npm init -y > /dev/null
          npm i -D playwright@1.47.2
          npx playwright install --with-deps chromium
      - name: Citizen flows (OTP, 137, dues, payment, tracking)
        run: BASE=http://localhost:8088 OUT=shots node tests/e2e/e2e.js
      - name: Page builder (template, drag & drop, publish)
        run: BASE=http://localhost:8088 OUT=shots node tests/e2e/builder.js
      - name: PHP errors must be empty
        run: |
          LOG="$RUNNER_TEMP/wp/site/wp-content/debug.log"
          if [ -f "$LOG" ] && grep -E "PHP (Fatal|Warning|Parse)" "$LOG"; then exit 1; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: shots/

  flutter:
    name: Flutter app (analyze, test, build APK)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter --version
      - name: Generate platform projects
        run: ./tool/setup_platforms.sh
      - name: Release signing (encrypted keystore + ANDROID_KEYSTORE_PASSWORD secret)
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_PASS" ]; then echo "No ANDROID_KEYSTORE_PASSWORD secret: debug-signed build, no release."; exit 0; fi
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -in android-signing/upload.jks.enc -out android/app/upload.jks -pass env:KS_PASS
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=boshrouyeh\nstoreFile=upload.jks\n' "$KS_PASS" "$KS_PASS" > android/key.properties
          python3 tool/apply_signing.py
          echo "SIGNED=1" >> "$GITHUB_ENV"
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test
      - name: Build APK
        run: |
          VERSION="1.0.${{ github.run_number }}"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          flutter build apk --release --build-name="$VERSION" --build-number=${{ github.run_number }} \
            --dart-define=API_BASE=https://varsin-bsh.ir/wp-json/bmn/v1/ --dart-define=SITE_URL=https://varsin-bsh.ir
          cp build/app/outputs/flutter-apk/app-release.apk build/boshrouyeh.apk
      - uses: actions/upload-artifact@v4
        with:
          name: boshrouyeh-man-apk
          path: app/build/boshrouyeh.apk
      - name: Publish GitHub Release (in-app updater reads this)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES="$(git log -1 --pretty=%s)"
          gh release create "v$APP_VERSION" build/boshrouyeh.apk --title "بشرویهٔ من $APP_VERSION" --notes "$NOTES" --latest
